# Browser Configuration
browser.name=chrome
browser.headless=false
browser.remote=false
browser.remote.url=http://localhost:4444/wd/hub
browser.implicitWait=10
browser.pageLoadTimeout=30
browser.windowSize=1920x1080
browser.closeAfterTest=true

# Test Configuration
test.baseUrl=https://www.google.com
test.timeout=30
test.retryCount=0

# Screenshot Configuration
screenshot.onFailure=true
screenshot.onSuccess=false

# Allure Configuration
allure.results.directory=target/allure-results

# Logging Configuration
logging.level.com.example.framework=DEBUG
logging.level.org.openqa.selenium=INFO

# Wait Configuration
wait.explicitWait=10
wait.implicitWait=10
wait.pageLoadTimeout=30

# Test Data Configuration
test.data.directory=src/test/resources/testdata
test.reports.directory=target/reports
